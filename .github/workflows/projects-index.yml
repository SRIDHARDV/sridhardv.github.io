name: Build site content

# Regenerates everything derived from content/: the project manifest, the
# sitemap, and the static page for each project. Adding a project is then:
# add the .md file, commit, push.
#
# The path filter matters: this job's own commit touches content/projects.json,
# sitemap.xml and p/**. None of those are inputs — projects.json is explicitly
# excluded below — so the job cannot retrigger itself.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '!content/projects.json'   # written by this job, not an input
      - 'tools/**'
      - 'CNAME'
      - '.github/workflows/projects-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exits 2 if a project uses markdown the generator does not support, so
      # unsupported syntax fails the build instead of shipping as wrong HTML.
      - name: Build
        run: python3 tools/build.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain content/projects.json sitemap.xml p)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/projects.json sitemap.xml p
            git commit -m "Rebuild generated pages"
            git push
          else
            echo "Generated files already up to date — nothing to commit."
          fi
