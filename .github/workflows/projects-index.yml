name: Update project index

# Keeps content/projects.json in step with the files in content/projects/,
# so adding a project is just: add the .md file, commit, push.
#
# The path filter matters: this job's own commit only touches
# content/projects.json, which is NOT under content/projects/, so it cannot
# retrigger itself.

on:
  push:
    branches: [main]
    paths:
      - 'content/projects/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the index
        run: python3 tools/rebuild_index.py

      - name: Commit if it changed
        run: |
          if [ -n "$(git status --porcelain content/projects.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/projects.json
            git commit -m "Update project index"
            git push
          else
            echo "Index already up to date — nothing to commit."
          fi
