name: Build site content

# Regenerates everything derived from the markdown: each project's page, the
# manifest the home grid reads, and the sitemap. Adding a project is then:
# add projects/<slug>/index.md, commit, push.
#
# The path filter matters. Sources and generated files now live in the same
# directory, so the negative patterns at the end are what stop this job's own
# commit from retriggering it. Order counts: for any path, the last matching
# pattern wins, so the exclusions must come after 'projects/**'.

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'profile.md'
      - 'tools/**'
      - 'CNAME'
      - '.github/workflows/projects-index.yml'
      - '!projects/**/index.html'   # written by this job
      - '!projects/manifest.json'   # written by this job
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exits 2 if a project uses markdown the generator does not support, so
      # unsupported syntax fails the build instead of shipping as wrong HTML.
      - name: Build
        run: python3 tools/build.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain projects sitemap.xml)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects sitemap.xml
            git commit -m "Rebuild generated pages"
            git push
          else
            echo "Generated files already up to date — nothing to commit."
          fi
