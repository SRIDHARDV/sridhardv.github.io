<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting… — Sridhar D V</title>

<!-- Legacy URL shim.
     Project pages used to live at project.html?p=<slug>. They are now static
     pages at /projects/<slug>/, generated by tools/build.py, so each one can
     serve its own title, description and canonical link — a query string
     cannot, because every ?p=… URL returns this same file.

     Kept so existing links and bookmarks still land somewhere sensible.
     noindex, because the destination is what should be in the index. -->
<meta name="robots" content="noindex, follow">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    else if (window.matchMedia('(prefers-color-scheme: light)').matches)
      document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}

  (function () {
    var slug = new URLSearchParams(location.search).get('p') || '';
    // Same slug shape the build script produces; anything else goes home.
    var target = /^[a-z0-9._-]+$/i.test(slug) ? 'projects/' + slug + '/' : './';
    location.replace(target);
  })();
</script>
</head>
<body>
<main id="main">
  <div class="wrap" style="padding:80px 0">
    <div class="notice">
      <strong>This page has moved.</strong><br>
      Project pages now live at <code>/projects/&lt;project&gt;/</code>.
      <a href="./">Back to all projects</a>.
    </div>
  </div>
</main>
</body>
</html>
