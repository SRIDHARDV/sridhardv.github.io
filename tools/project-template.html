<!DOCTYPE html>
<!-- Generated by tools/build.py from content/projects/{{SLUG}}.md — do not edit by hand. -->
<html lang="en" data-theme="dark" data-root="{{ROOT}}" data-project="{{SLUG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{AUTHOR}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="author" content="{{AUTHOR}}">
<link rel="canonical" href="{{CANONICAL}}">

<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:site_name" content="{{AUTHOR}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="{{OG_IMAGE_W}}">
<meta property="og:image:height" content="{{OG_IMAGE_H}}">
<meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:creator" content="{{TWITTER}}">

<link rel="icon" href="{{ROOT}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ROOT}}assets/css/style.css">
<script>
  // Apply saved theme before first paint to avoid a flash.
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
    else if (window.matchMedia('(prefers-color-scheme: light)').matches)
      document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a class="brand" href="{{ROOT}}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text" data-field="name">{{AUTHOR}}</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ROOT}}#projects">Projects</a>
      <a href="{{ROOT}}#about">About</a>
      <a href="{{ROOT}}#skills">Skills</a>
      <a href="{{ROOT}}#contact">Contact</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><g stroke-linecap="round"><path d="M12 2.6v2.4M12 19v2.4M4.2 12H1.8M22.2 12h-2.4M6.3 6.3 4.6 4.6M19.4 19.4l-1.7-1.7M17.7 6.3l1.7-1.7M4.6 19.4l1.7-1.7"/></g></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <div id="detailMain">
    <section class="detail-head">
      <div class="wrap">
        <a class="back-link" href="{{ROOT}}#projects">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>
          All projects
        </a>
        <h1 class="detail-title" id="detailTitle">{{TITLE}}</h1>
        <p class="detail-summary" id="detailSummary">{{DESCRIPTION}}</p>
        <div class="detail-meta" id="detailMeta">{{META}}</div>
      </div>
    </section>

    <div class="wrap">
{{HERO}}
      <div class="detail-layout">
        <article class="prose" id="projectBody">
{{BODY}}
        </article>
{{TOC}}
      </div>

{{NAV}}
    </div>
  </div>

  <section class="section section-contact" style="margin-top:clamp(48px,7vw,88px)">
    <div class="wrap contact-inner">
      <h2 class="contact-title" id="contactHeading">{{CONTACT_HEADING}}</h2>
      <div class="contact-lede" id="contactBody"></div>
      <ul class="socials socials-lg" id="socialsFooter" aria-label="Profiles elsewhere"></ul>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; <span id="year"></span> {{DOMAIN}} — All rights reserved.</p>
    <p class="footer-note">Built as a static site. Content lives in markdown.</p>
  </div>
</footer>

<!-- The article above is fully static. marked is still loaded because the footer
     contact block is hydrated live from content/profile.md, so editing the
     profile does not require regenerating every project page. -->
<script src="{{ROOT}}assets/js/marked.min.js"></script>
<script src="{{ROOT}}assets/js/app.js"></script>
</body>
</html>
